name: Daily Analytics Fetch

# GA4/GSCから1日分（3日前、反映ラグを避けるため）のデータを取得し、
# analytics/daily/YYYY-MM-DD.json としてmainへ直接コミットする。
# あわせて日別の推移表 analytics/DAILY.md を再生成し、
# 直近7日分を合算した analytics/WEEKLY.md も更新する（mainへ直接コミット）。
# 週次PR作成運用は2026-08に廃止。取得→合算分析→反映がこのワークフローで完結する。
#
# Issue自動記録（2026-08追加）:
#   全ステップ完了後、実行結果（success/failure/cancelled）を GitHub Issue として記録する。
#   タイトル: "daily-metrics: YYYY-MM-DD"（失敗時は "(failed)" 付き）
#   同日Issueが既に存在する場合は作成せずスキップする（重複防止・方針A）。

on:
  schedule:
    - cron: '0 2 * * *'  # 毎日 UTC 2:00 (日本時間 11:00)
  # 手動実行では過去日の埋め戻しができる。未入力なら定期実行と同じ「3日前の1日分」。
  workflow_dispatch:
    inputs:
      target_date:
        description: '取得範囲の最終日 (YYYY-MM-DD)。未入力なら3日前'
        required: false
        type: string
      backfill_days:
        description: '最終日から遡って取得する日数'
        required: false
        default: '1'
        type: string
      overwrite:
        description: '取得済みの日も取り直す'
        required: false
        default: false
        type: boolean

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install googleapis

      - name: Fetch daily analytics
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_DATE: ${{ inputs.target_date }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: node .github/scripts/fetch-analytics-daily.js

      # 取得が失敗した日も再生成する。その日が欠落行として推移表に出るため、
      # パイプラインが止まっていることがレポート上で分かる。
      - name: Build daily trend report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/build-daily-report.js

      # 蓄積済み日次データ（直近7日分）を合算して analytics/WEEKLY.md を更新する。
      # PRは作成せず main へ直接コミット（fetch-analytics-daily.js がコミットを担う）。
      # DAYS 環境変数で集計対象日数を変更可能（デフォルト7日）。
      - name: Aggregate daily data into weekly summary
        if: always()
        run: node .github/scripts/aggregate-daily.js

      # 実行結果を GitHub Issue として記録する。
      # キャンセル含む全ステータスで実行し、同日Issueが既に存在する場合はスキップ（重複防止・方針A）。
      # ラベル daily-metrics を付与し、失敗時はさらに failed ラベルを付与する。
      - name: Create daily result issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_STATUS: ${{ job.status }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: node .github/scripts/create-daily-issue.js
