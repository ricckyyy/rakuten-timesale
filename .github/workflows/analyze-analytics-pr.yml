name: Analyze Analytics PR

# 本流の「取得→分析→改善→マージ」は weekly-analytics.yml が同一ジョブ内で実行する。
# このワークフローは、人が手動で analytics/** ブランチの PR を開いた場合のフォールバック。
# 注意: pull_request の branches フィルタは base ブランチに対して評価されるため、
#       head ブランチ（analytics/**）の判定は job 側の if で行う。
#       また GITHUB_TOKEN で作成された PR はこのイベントを発火しない。
on:
  pull_request:
    types: [opened]

jobs:
  analyze:
    if: startsWith(github.head_ref, 'analytics/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Analyze, improve, and merge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node .github/scripts/analyze-analytics.js
