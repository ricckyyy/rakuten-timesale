name: Analyze Analytics PR

# [廃止] 2026-08 以降は weekly-analytics.yml の週次PR運用を停止したため、
# このフォールバックワークフローも無効化しました。
# 分析は daily-analytics-fetch.yml が毎日直接 main へコミットする運用に移行しました。
# 将来復活させる場合は on: ブロックのコメントアウトを外してください。
on:
  # Workflow disabled: deprecated in 2026-08
  # Analytics are now handled by daily-analytics-fetch.yml
  workflow_dispatch: # Manual trigger only (disabled by default)

jobs:
  analyze:
    if: startsWith(github.head_ref, 'analytics/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Analyze, improve, and merge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node .github/scripts/analyze-analytics.js
