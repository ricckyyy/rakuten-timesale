name: Weekly Analytics Report

on:
  schedule:
    - cron: '0 1 * * 1'  # 毎週月曜日 日本時間10:00 (UTC 01:00)
  workflow_dispatch:  # 手動実行も可能

jobs:
  analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install googleapis @anthropic-ai/sdk

      - name: Fetch analytics and create PR
        id: fetch
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/fetch-analytics.js

      # GITHUB_TOKEN で作成した PR は pull_request イベントを発火しないため、
      # 別ワークフローに依存せず同一ジョブ内で 分析→改善→マージ まで完結させる
      - name: Analyze, improve, and merge
        if: steps.fetch.outputs.pr_number != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.fetch.outputs.pr_number }}
          PR_BRANCH: ${{ steps.fetch.outputs.pr_branch }}
        run: node .github/scripts/analyze-analytics.js
