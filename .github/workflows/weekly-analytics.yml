name: Weekly Analytics Report

# daily-analytics-fetch.yml が毎日蓄積した analytics/daily/*.json 7日分を
# 集計してPRを作成する（重複・欠落のない週次実績）。GA4/GSCへは直接アクセスしない。

on:
  schedule:
    - cron: '0 22 * * 5'  # 毎週土曜日 日本時間7:00 (UTC金曜22:00)
  workflow_dispatch:  # 手動実行も可能

jobs:
  analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Aggregate daily data and create PR
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/aggregate-weekly.js

      # GITHUB_TOKEN で作成した PR は pull_request イベントを発火しないため、
      # 別ワークフローに依存せず同一ジョブ内で 分析→改善→マージ まで完結させる
      - name: Analyze, improve, and merge
        if: steps.fetch.outputs.pr_number != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.fetch.outputs.pr_number }}
          PR_BRANCH: ${{ steps.fetch.outputs.pr_branch }}
        run: node .github/scripts/analyze-analytics.js
